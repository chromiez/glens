<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Extractor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<style>
  :root{
    --bg: #0D1210;
    --surface: #161C19;
    --surface-2: #1E2521;
    --line: #2A332C;
    --text: #EAEFE9;
    --muted: #8FA098;
    --accent: #6FFFA0;
    --accent-dim: #3D8F5C;
    --accent-warm: #FF9B4D;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3, .display, button, .btn{
    font-family: 'Space Grotesk', sans-serif;
  }

  a{ color: var(--accent); }

  ::selection{ background: var(--accent); color: #08130C; }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- layout shell ---------- */
  .shell{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 28px 96px;
  }

  /* ---------- hero ---------- */
  .hero{
    padding: 72px 0 40px;
    display:flex;
    justify-content:center;
  }

  .hero-center{
    width:100%;
    max-width: 560px;
  }

  /* ---------- viewfinder / drop zone ---------- */
  .viewfinder{
    position: relative;
    aspect-ratio: 4/3;
    border-radius: 14px;
    background:
      radial-gradient(circle at 30% 20%, rgba(111,255,160,0.07), transparent 55%),
      var(--surface);
    border: 1px solid var(--line);
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
    overflow:hidden;
  }
  .viewfinder.drag-over{
    border-color: var(--accent);
    background: rgba(111,255,160,0.05);
  }
  .viewfinder .corner{
    position:absolute;
    width: 26px; height: 26px;
    border: 2px solid var(--accent-dim);
  }
  .viewfinder:hover .corner{ border-color: var(--accent); }
  .corner.tl{ top:14px; left:14px; border-right:none; border-bottom:none; }
  .corner.tr{ top:14px; right:14px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:14px; left:14px; border-right:none; border-top:none; }
  .corner.br{ bottom:14px; right:14px; border-left:none; border-top:none; }

  .viewfinder .icon{
    width:44px; height:44px;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .viewfinder h3{
    margin: 0 0 6px;
    font-size: 1.05rem;
    font-weight:600;
  }
  .viewfinder p{
    margin:0;
    color: var(--muted);
    font-size: 0.88rem;
  }

  input[type=file]{ display:none; }

  .upload-actions{
    display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; justify-content:center;
  }

  .upload-hint{
    margin-top: 12px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* ---------- buttons ---------- */
  .btn{
    appearance:none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: -0.005em;
    cursor:pointer;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .btn:hover{ border-color: var(--accent-dim); }
  .btn:active{ transform: scale(0.98); }
  .btn.primary{
    background: var(--accent);
    color: #08130C;
    border-color: var(--accent);
  }
  .btn.primary:hover{ background: #85ffb2; }
  .btn.warm{
    background: var(--accent-warm);
    color: #2A1200;
    border-color: var(--accent-warm);
  }
  .btn.warm:hover{ background: #ffad6b; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn svg{ width:15px; height:15px; }

  /* ---------- status / progress ---------- */
  #status{
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 1.2em;
  }

  /* ---------- workspace ---------- */
  #workspace{
    display:none;
    margin-top: 64px;
    border-top: 1px solid var(--line);
    padding-top: 40px;
  }
  #workspace.active{ display:block; }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .toolbar .group{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .word-count{
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .word-count b{ color: var(--text); }

  .workspace-grid{
    display:grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 24px;
    align-items:start;
  }

  .image-pane{
    position:relative;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    overflow:hidden;
    line-height:0;
  }
  .image-stage{
    position:relative;
    display:inline-block;
    user-select:none;
    touch-action: none;
  }
  .image-stage img{
    display:block;
    width:100%;
    height:auto;
  }
  .word-box{
    position:absolute;
    border-radius: 2px;
    background: rgba(111,255,160,0.0);
    outline: 1px solid rgba(111,255,160,0.28);
    cursor: text;
    transition: background .1s ease;
  }
  .word-box:hover{ background: rgba(111,255,160,0.16); }
  .word-box.selected{
    background: rgba(111,255,160,0.38);
    outline: 1px solid var(--accent);
  }
  .marquee{
    position:absolute;
    border: 1px dashed var(--accent-warm);
    background: rgba(255,155,77,0.08);
    pointer-events:none;
    display:none;
  }

  .output-pane{
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    display:flex;
    flex-direction:column;
    min-height: 320px;
  }
  .output-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .output-head span{
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: none;
  }
  #outputText{
    flex:1;
    margin:0;
    padding: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.86rem;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-y:auto;
    max-height: 460px;
  }
  #outputText:empty::before{
    content: "Selected words will appear here, in reading order.";
    color: var(--muted);
  }
  .copied-flag{
    font-size: 0.78rem;
    color: var(--accent);
    opacity:0;
    transition: opacity .2s ease;
  }
  .copied-flag.show{ opacity:1; }

  @media (max-width: 860px){
    .workspace-grid{ grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<div class="shell">

  <section class="hero">
    <div class="hero-center">
      <div class="viewfinder" id="dropZone" tabindex="0" role="button" aria-label="Upload or capture an image to scan">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>

        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2"/>
          <rect x="8.5" y="8.5" width="7" height="7" rx="1"/>
        </svg>
        <h3 id="vfTitle">Drop an image, or tap to choose one</h3>
        <p id="vfSub">Screenshots, receipts, book pages, signs — anything with text</p>

        <div class="upload-actions">
          <button type="button" class="btn primary" id="chooseBtn">Choose image</button>
          <button type="button" class="btn" id="cameraBtn">Use camera</button>
        </div>
        <p class="upload-hint">Camera captures select every word automatically — copy is ready right away.</p>
      </div>
      <input type="file" id="fileInput" accept="image/*">
      <input type="file" id="cameraInput" accept="image/*" capture="environment">

      <div id="status" aria-live="polite"></div>
    </div>
  </section>

  <section id="workspace">
    <div class="toolbar">
      <div class="group">
        <button type="button" class="btn warm" id="selectAllBtn">Select all text</button>
        <button type="button" class="btn" id="clearBtn">Clear selection</button>
        <button type="button" class="btn" id="rescanBtn">Scan a different image</button>
      </div>
      <div class="group">
        <span class="word-count" id="wordCount"><b>0</b> of <b>0</b> words selected</span>
      </div>
    </div>

    <div class="workspace-grid">
      <div class="image-pane">
        <div class="image-stage" id="imageStage">
          <img id="stageImg" alt="Uploaded image with detected text">
          <div class="marquee" id="marquee"></div>
        </div>
      </div>

      <div class="output-pane">
        <div class="output-head">
          <span>Extracted text</span>
          <div style="display:flex; align-items:center; gap:12px;">
            <span class="copied-flag" id="copiedFlag">Copied</span>
            <button type="button" class="btn" id="copyBtn">Copy</button>
          </div>
        </div>
        <pre id="outputText"></pre>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const cameraInput = document.getElementById('cameraInput');
  const chooseBtn = document.getElementById('chooseBtn');
  const cameraBtn = document.getElementById('cameraBtn');
  const status = document.getElementById('status');
  const vfTitle = document.getElementById('vfTitle');
  const vfSub = document.getElementById('vfSub');

  const workspace = document.getElementById('workspace');
  const imageStage = document.getElementById('imageStage');
  const stageImg = document.getElementById('stageImg');
  const marquee = document.getElementById('marquee');
  const selectAllBtn = document.getElementById('selectAllBtn');
  const clearBtn = document.getElementById('clearBtn');
  const rescanBtn = document.getElementById('rescanBtn');
  const wordCountEl = document.getElementById('wordCount');
  const outputText = document.getElementById('outputText');
  const copyBtn = document.getElementById('copyBtn');
  const copiedFlag = document.getElementById('copiedFlag');

  let words = [];        // {text, x0,y0,x1,y1, selected, lineIndex}
  let lines = [];         // arrays of word indices, in reading order
  let naturalW = 0, naturalH = 0;
  let boxEls = [];

  chooseBtn.addEventListener('click', () => fileInput.click());
  cameraBtn.addEventListener('click', () => cameraInput.click());
  dropZone.addEventListener('click', (e) => {
    if (e.target === chooseBtn || e.target === cameraBtn) return;
    fileInput.click();
  });
  dropZone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });

  fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0], false); });
  cameraInput.addEventListener('change', () => { if (cameraInput.files[0]) handleFile(cameraInput.files[0], true); });

  ['dragenter','dragover'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  });
  ['dragleave','drop'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); });
  });
  dropZone.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) handleFile(f, false);
  });

  function setStatus(msg){ status.textContent = msg; }

  function handleFile(file, fromCamera){
    const reader = new FileReader();
    reader.onload = (e) => runOCR(e.target.result, fromCamera);
    reader.readAsDataURL(file);
  }

  // Upscales small images and boosts contrast before handing the frame to
  // Tesseract — this is what actually moves accuracy, especially for
  // photos of a monitor (low contrast, glare) or a printed page (uneven
  // lighting). Returns a <canvas> ready to pass straight into recognize().
  // Advanced preprocessing pipeline: upscale small/blurry captures, convert
  // to grayscale, stretch contrast to the full range, then sharpen edges so
  // thin character strokes and small symbols (punctuation, currency signs,
  // etc.) stay crisp for the OCR engine. This is what actually drives
  // accuracy — especially on monitor photos (low contrast, glare) and
  // printed pages (uneven lighting).
  function sizedCanvas(img){
    const minWidth = 1400, maxWidth = 2600;
    let scale = 1;
    if (img.naturalWidth < minWidth) scale = Math.min(2, minWidth / img.naturalWidth);
    else if (img.naturalWidth > maxWidth) scale = maxWidth / img.naturalWidth;
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    return canvas;
  }

  // Grayscale + gentle, histogram-based contrast normalization and a light
  // unsharp mask. Clipping to the 2nd/98th percentile (rather than the
  // absolute min/max) and blending the sharpen in at partial strength keeps
  // this from over-processing already-crisp text (screenshots, clean
  // photos) — which was previously shattering small glyphs into noise.
  function enhance(sourceCanvas){
    const w = sourceCanvas.width, h = sourceCanvas.height;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(sourceCanvas, 0, 0);
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;

    const gray = new Float32Array(w * h);
    const hist = new Uint32Array(256);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      gray[p] = g;
      hist[Math.round(g)]++;
    }

    const total = w * h, tailTarget = total * 0.02;
    let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= tailTarget) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= tailTarget) { hi = v; break; } }
    const range = Math.max(hi - lo, 1);

    const stretched = new Float32Array(w * h);
    for (let p = 0; p < gray.length; p++) {
      stretched[p] = Math.min(255, Math.max(0, (gray[p] - lo) * (255 / range)));
    }

    const amount = 0.35; // partial-strength sharpen, not a full kernel
    const out = new Uint8ClampedArray(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;
        if (x === 0 || y === 0 || x === w - 1 || y === h - 1) { out[idx] = stretched[idx]; continue; }
        const center = stretched[idx];
        const nbAvg = (stretched[idx - w] + stretched[idx + w] + stretched[idx - 1] + stretched[idx + 1]) / 4;
        out[idx] = center + amount * (center - nbAvg);
      }
    }

    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const v = out[p];
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  // Screens are frequently light text on a dark background (dark-mode
  // apps, code editors, terminals). OCR models are trained overwhelmingly
  // on dark text on light paper, so an inverted copy is tried too.
  function invertCanvas(sourceCanvas){
    const canvas = document.createElement('canvas');
    canvas.width = sourceCanvas.width;
    canvas.height = sourceCanvas.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(sourceCanvas, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = 255 - d[i]; d[i + 1] = 255 - d[i + 1]; d[i + 2] = 255 - d[i + 2];
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  // Runs recognition on three candidates — the raw image, an enhanced
  // version, and an inverted-enhanced version — and keeps whichever the
  // engine is most confident in. Keeping the untouched raw image as one of
  // the candidates means preprocessing can only ever help, never hurt: if
  // enhancement makes a particular image worse, the raw pass wins instead.
  async function recognizeBest(img){
    const raw = sizedCanvas(img);
    const enhanced = enhance(raw);
    const inverted = invertCanvas(enhanced);

    const results = await Promise.all([
      Tesseract.recognize(raw, 'eng'),
      Tesseract.recognize(enhanced, 'eng'),
      Tesseract.recognize(inverted, 'eng')
    ]);
    const score = (r) => (r.data.words && r.data.words.length) ? r.data.confidence : -1;
    return results.reduce((best, r) => (score(r) > score(best) ? r : best));
  }

  function runOCR(dataUrl, fromCamera){
    words = []; lines = [];
    outputText.textContent = '';
    wordCountEl.innerHTML = '<b>0</b> of <b>0</b> words selected';
    workspace.classList.add('active');
    setButtonsEnabled(false);
    setStatus('Reading the text…');

    const sourceImg = new Image();
    sourceImg.onload = () => {
      recognizeBest(sourceImg).then(({ data }) => {
        buildWords(data.words || []);
        stageImg.onload = () => {
          placeStage();
          layoutBoxes();
          setButtonsEnabled(true);

          if (words.length === 0) {
            setStatus('No text was detected in that image. Try better lighting or holding the camera steadier.');
            return;
          }

          if (fromCamera) {
            selectAll();
            setStatus('Found ' + words.length + ' word' + (words.length === 1 ? '' : 's') + ' — all selected and copied.');
            const outputPane = document.querySelector('.output-pane');
            outputPane.scrollIntoView({ behavior: 'smooth', block: 'center' });
            autoCopy();
          } else {
            setStatus('Found ' + words.length + ' word' + (words.length === 1 ? '' : 's') + '. Tap a word, drag over several, or select all.');
            workspace.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };
        stageImg.src = dataUrl;
      }).catch((err) => {
        console.error(err);
        setButtonsEnabled(true);
        setStatus('Something went wrong reading that image. Please try another one.');
      });
    };
    sourceImg.onerror = () => {
      setButtonsEnabled(true);
      setStatus('That file could not be opened as an image.');
    };
    sourceImg.src = dataUrl;
  }

  function setButtonsEnabled(enabled){
    [selectAllBtn, clearBtn, copyBtn].forEach(b => b.disabled = !enabled);
  }

  async function autoCopy(){
    try {
      await navigator.clipboard.writeText(outputText.textContent);
      copiedFlag.classList.add('show');
      setTimeout(() => copiedFlag.classList.remove('show'), 1600);
    } catch (e) {
      // Clipboard permission can be blocked silently by the browser —
      // the text is already selected and visible, so a manual tap on
      // Copy still works.
    }
  }

  function buildWords(rawWords){
    const clean = rawWords
      .filter(w => w.text && w.text.trim().length > 0)
      .map(w => ({
        text: w.text,
        x0: w.bbox.x0, y0: w.bbox.y0, x1: w.bbox.x1, y1: w.bbox.y1,
        selected: false
      }));

    clean.sort((a, b) => (a.y0 - b.y0) || (a.x0 - b.x0));

    const avgH = clean.reduce((s, w) => s + (w.y1 - w.y0), 0) / (clean.length || 1);
    const lineThreshold = Math.max(avgH * 0.6, 6);

    lines = [];
    clean.forEach((w, i) => {
      const cy = (w.y0 + w.y1) / 2;
      let line = lines.find(l => Math.abs(l.cy - cy) < lineThreshold);
      if (!line) {
        line = { cy, indices: [] };
        lines.push(line);
      } else {
        line.cy = (line.cy * line.indices.length + cy) / (line.indices.length + 1);
      }
      line.indices.push(i);
    });

    lines.forEach(l => l.indices.sort((a, b) => clean[a].x0 - clean[b].x0));
    lines.sort((a, b) => a.cy - b.cy);

    words = clean;
  }

  function placeStage(){
    naturalW = stageImg.naturalWidth;
    naturalH = stageImg.naturalHeight;
  }

  function layoutBoxes(){
    boxEls.forEach(el => el.remove());
    boxEls = [];
    const rect = stageImg.getBoundingClientRect();
    const scale = rect.width / naturalW;

    words.forEach((w, i) => {
      const el = document.createElement('div');
      el.className = 'word-box';
      el.style.left = (w.x0 * scale) + 'px';
      el.style.top = (w.y0 * scale) + 'px';
      el.style.width = ((w.x1 - w.x0) * scale) + 'px';
      el.style.height = ((w.y1 - w.y0) * scale) + 'px';
      el.dataset.index = i;
      el.title = w.text;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        w.selected = !w.selected;
        el.classList.toggle('selected', w.selected);
        refreshOutput();
      });
      imageStage.appendChild(el);
      boxEls.push(el);
    });
  }

  window.addEventListener('resize', () => { if (words.length) layoutBoxes(); });

  function selectAll(){
    words.forEach((w, i) => { w.selected = true; boxEls[i] && boxEls[i].classList.add('selected'); });
    refreshOutput();
  }
  function clearAll(){
    words.forEach((w, i) => { w.selected = false; boxEls[i] && boxEls[i].classList.remove('selected'); });
    refreshOutput();
  }
  selectAllBtn.addEventListener('click', selectAll);
  clearBtn.addEventListener('click', clearAll);

  rescanBtn.addEventListener('click', () => {
    workspace.classList.remove('active');
    words = []; lines = [];
    dropZone.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  function refreshOutput(){
    const selectedCount = words.filter(w => w.selected).length;
    wordCountEl.innerHTML = '<b>' + selectedCount + '</b> of <b>' + words.length + '</b> words selected';

    const out = [];
    lines.forEach(line => {
      const picked = line.indices.filter(i => words[i].selected).map(i => words[i].text);
      if (picked.length) out.push(picked.join(' '));
    });
    outputText.textContent = out.join('\n');
  }

  // drag-to-select (marquee), mouse + touch
  let dragging = false, startX = 0, startY = 0;

  function stagePoint(clientX, clientY){
    const r = imageStage.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }

  function beginDrag(clientX, clientY){
    if (!words.length) return;
    dragging = true;
    const p = stagePoint(clientX, clientY);
    startX = p.x; startY = p.y;
    marquee.style.display = 'block';
    marquee.style.left = startX + 'px';
    marquee.style.top = startY + 'px';
    marquee.style.width = '0px';
    marquee.style.height = '0px';
  }
  function moveDrag(clientX, clientY){
    if (!dragging) return;
    const p = stagePoint(clientX, clientY);
    const x = Math.min(p.x, startX), y = Math.min(p.y, startY);
    const w = Math.abs(p.x - startX), h = Math.abs(p.y - startY);
    marquee.style.left = x + 'px'; marquee.style.top = y + 'px';
    marquee.style.width = w + 'px'; marquee.style.height = h + 'px';
  }
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    const mRect = marquee.getBoundingClientRect();
    marquee.style.display = 'none';
    if (mRect.width > 4 && mRect.height > 4) {
      boxEls.forEach((el, i) => {
        const bRect = el.getBoundingClientRect();
        const intersects = !(bRect.right < mRect.left || bRect.left > mRect.right ||
                              bRect.bottom < mRect.top || bRect.top > mRect.bottom);
        if (intersects) { words[i].selected = true; el.classList.add('selected'); }
      });
      refreshOutput();
    }
  }

  imageStage.addEventListener('mousedown', (e) => { if (e.target === imageStage || e.target === stageImg) beginDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
  window.addEventListener('mouseup', endDrag);

  imageStage.addEventListener('touchstart', (e) => {
    if (e.target === imageStage || e.target === stageImg) {
      const t = e.touches[0]; beginDrag(t.clientX, t.clientY);
    }
  }, { passive: true });
  imageStage.addEventListener('touchmove', (e) => {
    if (dragging) { const t = e.touches[0]; moveDrag(t.clientX, t.clientY); }
  }, { passive: true });
  imageStage.addEventListener('touchend', endDrag);

  // copy
  copyBtn.addEventListener('click', async () => {
    const text = outputText.textContent;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    copiedFlag.classList.add('show');
    setTimeout(() => copiedFlag.classList.remove('show'), 1400);
  });
})();
</script>

</body>
